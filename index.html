  vis.forEach(s=>{let d="",pen=false;s.values.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1);pen=true});g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round"/>`});
  g+=`<line class="gl" x1="0" x2="0" y1="${MT}" y2="${MT+ph}" stroke="var(--ink-3)" stroke-dasharray="3 3" visibility="hidden"/>`;
  vis.forEach((s,j)=>g+=`<circle class="mk" data-j="${j}" r="4.5" fill="${s.color}" stroke="var(--panel)" stroke-width="2" visibility="hidden"/>`);
  g+=`<rect class="hit" x="${ML}" y="${MT}" width="${pw}" height="${ph}" fill="transparent"/></svg>`;
  host.innerHTML=g;
  const svg=host.firstChild,hit=$(".hit",svg),gl=$(".gl",svg),mks=[...svg.querySelectorAll(".mk")];
  function move(ev){const t=ev.touches?ev.touches[0]:ev;const r=svg.getBoundingClientRect();const sx=(t.clientX-r.left)*W/r.width;
    const i=Math.max(0,Math.min(n-1,Math.round((sx-ML)/(pw/Math.max(1,n-1)))));const x=X(i);gl.setAttribute("x1",x);gl.setAttribute("x2",x);gl.setAttribute("visibility","visible");
    let rows="";vis.forEach((s,j)=>{const v=s.values[i];const m=mks[j];if(v==null){m.setAttribute("visibility","hidden")}else{m.setAttribute("cx",x);m.setAttribute("cy",Y(v));m.setAttribute("visibility","visible")}
      rows+=`<div class="r"><span><span class="sw" style="background:${s.color}"></span> ${esc(s.name)}</span><span class="num">${v==null?"데이터 없음":fmt(v,2)}</span></div>`});
    const part=o.partialFrom!=null&&i>=o.partialFrom?" (미완료 구간)":"";
    showTip(`<div class="t">${esc(o.x[i])} · ${UNIT[o.unit]}${part}</div>${rows}<div class="src">${o.src||"단위: 상대지수(이 그룹 최댓값=100) · 네이버 데이터랩"}</div>`,t.clientX,t.clientY)}
  function leave(){gl.setAttribute("visibility","hidden");mks.forEach(m=>m.setAttribute("visibility","hidden"));hideTip()}
  hit.addEventListener("mousemove",move);hit.addEventListener("touchmove",e=>{move(e)},{passive:true});hit.addEventListener("touchstart",e=>{move(e)},{passive:true});
  hit.addEventListener("mouseleave",leave);hit.addEventListener("touchend",()=>setTimeout(leave,1500));
}

/* ---------- 막대 그래프(언급 수) ---------- */
function barChart(host,o){
  const W=Math.max(host.clientWidth||300,240),H=150,ML=30,MR=8,MT=10,MB=26,pw=W-ML-MR,ph=H-MT-MB,n=o.x.length;
  const mx=niceMax(Math.max(1,...o.v.filter(v=>v!=null))),bw=pw/n;
  const Y=v=>MT+ph-(v/mx)*ph;
  let g=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title)}"><g class="grid">`;
  for(const k of [0,.5,1]){const v=mx*k;g+=`<line x1="${ML}" x2="${W-MR}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${ML-5}" y="${Y(v)+4}" text-anchor="end">${Math.round(v)}</text>`}
  g+="</g>";
  o.x.forEach((d,i)=>{const v=o.v[i];const cut=o.cut&&d<o.cut;if(v!=null&&v>0)g+=`<rect x="${ML+i*bw+1}" y="${Y(v)}" width="${Math.max(1,bw-2)}" height="${MT+ph-Y(v)}" fill="${o.color}" opacity="${cut?.35:1}"/>`});
  if(o.cut&&o.x[0]<o.cut){const ci=o.x.findIndex(d=>d>=o.cut);if(ci>0)g+=`<line x1="${ML+ci*bw}" x2="${ML+ci*bw}" y1="${MT}" y2="${MT+ph}" stroke="var(--warn)" stroke-dasharray="3 3"/>`}
  g+=`<text x="${ML}" y="${H-8}" text-anchor="start">${o.x[0].slice(5).replace("-",".")}</text><text x="${W-MR}" y="${H-8}" text-anchor="end">${o.x[n-1].slice(5).replace("-",".")}</text>`;
  g+=`<rect class="hit" x="${ML}" y="${MT}" width="${pw}" height="${ph}" fill="transparent"/></svg>`;
  host.innerHTML=g;const svg=host.firstChild,hit=$(".hit",svg);
  function move(ev){const t=ev.touches?ev.touches[0]:ev;const r=svg.getBoundingClientRect();const sx=(t.clientX-r.left)*W/r.width;const i=Math.max(0,Math.min(n-1,Math.floor((sx-ML)/bw)));
    const d=o.x[i],cut=o.cut&&d<o.cut;showTip(`<div class="t">${d}</div><div class="r"><span>${esc(o.label)}</span><span class="num">${cut?"표본 밖":fint(o.v[i])+"건"}</span></div><div class="src">최신 100건 표본 기준 작성일 분포${cut?" · 이 날짜는 100건 상한 밖이라 집계 불완전":""}</div>`,t.clientX,t.clientY)}
  hit.addEventListener("mousemove",move);hit.addEventListener("touchstart",move,{passive:true});hit.addEventListener("touchmove",move,{passive:true});
  hit.addEventListener("mouseleave",hideTip);hit.addEventListener("touchend",()=>setTimeout(hideTip,1500));
}


function spark(vals,color){const v=vals.filter(x=>x!=null);if(v.length<2)return'<span class="caption">–</span>';
  const W=120,H=30,mx=Math.max(...v),mn=Math.min(...v),rg=mx-mn||1;let d="",pen=false;
  vals.forEach((x,i)=>{if(x==null){pen=false;return}d+=(pen?"L":"M")+(i*(W-4)/(vals.length-1)+2).toFixed(1)+" "+(H-3-(x-mn)/rg*(H-6)).toFixed(1);pen=true});
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6"/></svg>`}

/* ---------- 값 계산 ---------- */
function daily(kw){const k=st.kind,b=kw.blog[k],c=kw.cafe[k];
  if(st.src==="blog")return b.slice();if(st.src==="cafe")return c.slice();
  /* 블로그+카페: 카페가 아직 없는 날은 블로그 값만(카페 수집 시작 전) — 표시에 명시 */
  return b.map((v,i)=>v==null&&c[i]==null?null:(v||0)+(c[i]||0))}
function wsum(a){if(a.some(x=>x==null))return null;return a.reduce((s,x)=>s+x,0)}
function eventOn(ev){if(!ev||!ev.months)return false;const m=+DATA.today.slice(5,7);const p=+DATA.days[DATA.days.length-14].slice(5,7);return ev.months.includes(m)||ev.months.includes(p)}
function rows(){const out=[];const n=DATA.days.length;
  DATA.themes.forEach((th,ti)=>{if(st.grp&&th.group!==st.grp)return;th.kws.forEach((kw,j)=>{const v=daily(kw);
    const C=wsum(v.slice(n-7)),B=wsum(v.slice(n-14,n-7)),A=wsum(v.slice(n-21,n-14)),c28=wsum(v.slice(n-28));
    const allC=wsum((st.src==="cafe"?kw.cafe.all:st.src==="blog"?kw.blog.all:kw.blog.all.map((x,i)=>x==null&&kw.cafe.all[i]==null?null:(x||0)+(kw.cafe.all[i]||0))).slice(n-7));
    const consC=wsum((st.src==="cafe"?kw.cafe.consumer:st.src==="blog"?kw.blog.consumer:kw.blog.consumer.map((x,i)=>x==null&&kw.cafe.consumer[i]==null?null:(x||0)+(kw.cafe.consumer[i]||0))).slice(n-7));
    const P=(kw.codes||[]).map(c=>DATA.stocks[c]).filter(Boolean);
    /* 글이 아주 많아 최신 1,000개가 7일을 못 덮은 키워드: 덮인 날의 하루 평균 × 7로 추정(≈ 표시) */
    let est=null,estDays=0;if(C==null){const w=v.slice(n-7).filter(x=>x!=null);estDays=w.length;if(w.length>=3)est=w.reduce((s,x)=>s+x,0)/w.length*7}
    out.push({ti,j,name:kw.name,stock:kw.stock,theme:th.short,kind:th.kind,ev:kw.event,evOn:eventOn(kw.event),C,B,A,c28,est,estDays,vol:C!=null?C:est,
      recent:C!=null&&B>=MIN_BASE?C/B-1:null,prev:B!=null&&A>=MIN_BASE?B/A-1:null,low:B!=null&&B<MIN_BASE,
      cons:allC?consC/allC:null,p7:P.length?P.map(x=>x.chg7).filter(x=>x!=null).reduce((s,x,_,a)=>s+x/a.length,0):null,pn:P.map(x=>x.n).join("·"),sp:v.slice(-30)})})});
  return out}

/* ---------- 신호판(최근 7일 vs 직전 7일 vs 그 전 7일) ---------- */
function signalBoard(R){const pool=R.filter(r=>r.recent!=null&&r.prev!=null&&!(st.sep&&r.evOn));
  const top=(f,sc)=>pool.filter(f).sort((a,b)=>sc(b)-sc(a)).slice(0,5);
  const S={up:top(r=>r.prev>=0&&r.recent>0,r=>r.recent),down:top(r=>r.prev<=0&&r.recent<0,r=>-r.recent),
    rebound:top(r=>r.prev<0&&r.recent>0,r=>r.recent-r.prev),peak:top(r=>r.prev>0&&r.recent<0,r=>r.prev-r.recent)};
  const evs=R.filter(r=>r.evOn&&r.recent!=null);
  const n=DATA.days.length,d=DATA.days;
  const box=(key,icon,title,desc,color)=>{const list=S[key];return `<div class="sigbox" style="--c:var(${color})"><h3>${icon} ${title}</h3><div class="caption">${desc}</div>
    ${list.length?`<ol>${list.map((r,i)=>`<li><button type="button" data-q="${esc(r.name)}" aria-label="${esc(r.name)} 보기"><span class="rk">${i+1}</span><span class="nm"><b>${esc(r.name)}</b> <span class="caption">${esc(r.stock)}</span></span><span>${spark(r.sp,css(color))}</span>
      <span class="sub"><span>최근 7일 <b class="num">${fint(r.C)}건</b> ${pct(r.recent)}</span><span>직전 ${pct(r.prev)}</span><span class="caption">${esc(r.theme)}</span></span></button></li>`).join("")}</ol>`:'<div class="caption" style="margin-top:8px">해당하는 키워드가 없습니다.</div>'}</div>`};
  return `<section class="card"><h2>버즈 신호판 <span class="caption">— 블로그·카페 새 글 수 기준 · 검색량·주가 아님</span></h2>
  <div class="muted">하루 새로 올라온 글 수로 흐름을 나눕니다. 최근 7일(${d[n-7].slice(5)}~${d[n-1].slice(5)}) · 직전 7일(${d[n-14].slice(5)}~${d[n-8].slice(5)}) · 그 전 7일(${d[n-21].slice(5)}~${d[n-15].slice(5)}).</div>
  ${ctrl()}
  <div class="caption">직전 구간 글이 ${MIN_BASE}건 미만인 키워드는 순위에서 뺍니다. ${st.sep?"이벤트 시즌(빼빼로데이·패딩 등)에 걸린 키워드도 따로 뺍니다.":"이벤트 시즌 키워드도 포함 중입니다."}</div>
  <div class="sig">${box("up","📈","상승 지속","직전·최근 모두 늘었고 최근 증가율이 큰 순","--up")}${box("down","📉","하락 지속","직전·최근 모두 줄었고 최근 감소율이 큰 순","--down")}
  ${box("rebound","↗️","반등 (감소 → 증가)","직전엔 줄었다가 최근 늘어난 것","--s3")}${box("peak","↘️","꺾임 (증가 → 감소)","직전엔 늘었다가 최근 줄어든 것","--s2")}</div>
  ${evs.length&&st.sep?`<div class="caption" style="margin-top:8px"><b>🗓️ 이벤트 시즌으로 따로 뺀 키워드</b></div><div class="chips">${evs.map(r=>`<button type="button" class="chip" data-q="${esc(r.name)}">${esc(r.name)} ${pct(r.recent)} <span class="caption">${esc(r.ev.label)}</span></button>`).join("")}</div>`:""}</section>`}

/* ---------- 버즈 규모 순위(절대 글 수라 키워드끼리 비교 가능) ---------- */
function volTxt(r){return r.C!=null?fint(r.C)+"건":r.est!=null?`≈${fint(Math.round(r.est))}건 <span class="caption">(${r.estDays}일치 추정)</span>`:'<span class="caption">집계 중(글이 매우 많음)</span>'}
function volumeBoard(R){const v=R.filter(r=>r.vol!=null).sort((a,b)=>b.vol-a.vol).slice(0,10),mx=v.length?v[0].vol:1;
  const busy=R.filter(r=>r.vol==null).map(r=>r.name);
  return `<section class="card"><h2>최근 7일 글이 가장 많은 키워드 Top 10</h2>
  <div class="muted">검색어 트렌드와 달리 <b>실제 글 수</b>라 테마가 달라도 규모를 바로 비교할 수 있습니다. ‘≈’는 글이 너무 많아 API가 주는 최신 1,000개가 7일을 못 덮은 키워드로, 덮인 날의 하루 평균으로 추정한 값입니다(매일 쌓이며 실제 값으로 바뀜).</div>
  <div class="scroll"><table><thead><tr><th>#</th><th>키워드</th><th>최근 7일 글</th><th style="min-width:140px">규모</th><th>직전 7일 대비</th><th>소비자 글 비중</th><th>연결 종목</th></tr></thead><tbody>
  ${v.map((r,i)=>`<tr data-q="${esc(r.name)}" style="cursor:pointer"><td class="num">${i+1}</td><td class="l"><b>${esc(r.name)}</b> <span class="caption">${esc(r.theme)}</span></td><td class="num">${volTxt(r)}</td>
    <td><div style="height:10px;border-radius:5px;background:var(--accent);width:${Math.max(3,r.vol/mx*100).toFixed(0)}%"></div></td><td>${pct(r.recent)}</td><td class="num">${r.cons==null?"–":(r.cons*100).toFixed(0)+"%"}</td><td class="l caption">${esc(r.stock)}</td></tr>`).join("")}</tbody></table></div>
  ${busy.length?`<div class="caption">글이 하루 수백~1,000건 이상이라 아직 집계 중인 키워드 ${busy.length}개(매일 쌓이며 1~2주 안에 들어옴): ${busy.slice(0,30).map(esc).join(", ")}${busy.length>30?" 외":""}</div>`:""}</section>`}

/* ---------- 전체 표 ---------- */
function tableCard(R){const k=st.sortK,dir=st.sortD,val=(r,x)=>r[x]==null||!isFinite(r[x])?-1e15*dir:r[x];
  R.sort((a,b)=>typeof a[k]==="string"?a[k].localeCompare(b[k],"ko")*dir:(val(a,k)-val(b,k))*dir);
  const cols=[["theme","테마"],["name","키워드"],["stock","연결 종목"],["vol","최근 7일 글"],["B","직전 7일 글"],["recent","증감"],["cons","소비자 글 비중"],["c28","최근 28일 글"],["p7","주가 7일"]];
  return `<section class="card"><h2>전체 키워드 — ${R.length}개</h2><div class="scroll" style="max-height:70vh;overflow-y:auto"><table id="bt"><thead><tr>${cols.map(([x,l])=>`<th data-s="${x}" aria-sort="${x===k?(dir>0?"ascending":"descending"):"none"}">${l}${x===k?(dir>0?" ▲":" ▼"):""}</th>`).join("")}<th>30일 추이</th></tr></thead><tbody>
  ${R.map(r=>`<tr data-q="${esc(r.name)}" style="cursor:pointer"><td class="l">${esc(r.theme)}</td><td class="l"><b>${esc(r.name)}</b>${r.evOn?` <span class="caption">🗓️${esc(r.ev.label)}</span>`:""}</td><td class="l caption">${esc(r.stock)}</td>
   <td class="num">${volTxt(r)}</td><td class="num">${r.B==null?"–":fint(r.B)}</td><td>${r.low?'<span class="caption">적은 글</span>':pct(r.recent)}</td><td class="num">${r.cons==null?"–":(r.cons*100).toFixed(0)+"%"}</td><td class="num">${r.c28==null?"–":fint(r.c28)}</td><td>${r.p7==null?"–":pct(r.p7)}</td><td>${spark(r.sp,css("--s1"))}</td></tr>`).join("")}</tbody></table></div>
  <div class="caption">머리글을 누르면 정렬됩니다. 주가 7일 = 연결 종목 종가 7일 등락(여러 종목이면 평균, 종가 기준일 ${esc(DATA.price_asof||"–")}).</div></section>`}

function ctrl(){return `<div class="ctrl">
  <div class="seg" role="group" aria-label="소스">${Object.entries(SRC).map(([k,l])=>`<button type="button" data-src="${k}" aria-pressed="${st.src===k}">${l}</button>`).join("")}</div>
  <div class="seg" role="group" aria-label="글 종류">${Object.entries(KIND).map(([k,l])=>`<button type="button" data-kind="${k}" aria-pressed="${st.kind===k}">${l}</button>`).join("")}</div>
  <div class="seg" role="group" aria-label="이벤트 분리"><button type="button" data-sep="1" aria-pressed="${st.sep}">이벤트 분리</button><button type="button" data-sep="0" aria-pressed="${!st.sep}">모두 포함</button></div>
  <select id="grp" aria-label="분야" style="min-height:40px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);font:inherit;font-size:14px;padding:0 8px"><option value="">모든 분야</option>${groups().map(g=>`<option ${g===st.grp?"selected":""}>${esc(g)}</option>`).join("")}</select></div>`}
function groups(){return [...new Set(DATA.themes.map(t=>t.group))]}
function statusCard(){const kw=DATA.themes.flatMap(t=>t.kws);const bf=kw.map(k=>k.blog_from).filter(Boolean).sort();const n=DATA.days.length;

  카페 누적 <b>${DATA.cafe_days}일째</b>${DATA.cafe_days<21?` — 3구간(21일) 비교가 되려면 ${21-DATA.cafe_days}일 더 필요해서, 그 전까지 ‘블로그+카페’는 사실상 블로그 위주입니다`:""}.
  ${capped?` 블로그 글이 아주 많은 ${capped}개 키워드는 1,000개 상한 때문에 21일치를 다 못 채워 순위에서 빠질 수 있습니다(매일 쌓이며 해소).`:""}
  소비자 글 = 협찬·체험단·이벤트·할인·예약 문구나 병원·업체 작성자를 뺀 글(요약 기반 규칙 분류라 완벽하지 않음). · 기준 ${esc((DATA.updated_at||"").replace("T"," "))} KST</section>`}

/* ---------- 키워드 보기(검색·테마) ---------- */
function ma7(a){return a.map((_,i)=>{const w=a.slice(Math.max(0,i-6),i+1);return w.length<7||w.some(x=>x==null)?null:w.reduce((s,x)=>s+x,0)/7})}
function kwCard(th,kw,id){const v=daily(kw),n=DATA.days.length,per=st.per,x=DATA.days.slice(n-per);
  const C=wsum(v.slice(n-7)),B=wsum(v.slice(n-14,n-7));
  return {html:`<section class="card"><h3>${esc(kw.name)} <span class="caption">${esc(kw.stock)} · ${esc(th.short)} · 검색어 “${esc(kw.term)}”</span></h3>
   <div class="kpis"><span><span class="k">최근 7일</span> <b class="num">${C==null?"–":fint(C)}건</b></span><span><span class="k">직전 7일 대비</span> ${C!=null&&B>=MIN_BASE?pct(C/B-1):'<span class="caption">NA</span>'}</span>
   <span><span class="k">블로그 시작</span> ${esc(kw.blog_from||"–")}</span><span><span class="k">카페 시작</span> ${esc(kw.cafe_from||"–")}</span>${kw.event?`<span>🗓️ ${esc(kw.event.label)}</span>`:""}</div>
   <div class="scroll" id="${id}"></div></section>`,
   draw:()=>lineChart($("#"+id),{x,unit:"date",partialFrom:null,title:kw.name,src:`단위: 하루 새 글 수(${SRC[st.src]} · ${KIND[st.kind]}) · 네이버 블로그·카페 검색 API`,
     series:[{name:"하루 새 글",values:v.slice(n-per),color:css("--s4")},{name:"7일 평균",values:ma7(v).slice(n-per),color:css("--s1")}]})}}
function renderList(title,items,note){let h=`<section class="card"><h2>${title}</h2>${note||""}${ctrl()}
  <div class="seg" role="group" aria-label="기간" style="margin-top:6px">${[["2주",14],["30일",30],["60일",60]].map(([l,p])=>`<button type="button" data-per="${p}" aria-pressed="${st.per===p}">${l}</button>`).join("")}</div></section>`;
  const draws=[];items.forEach(([th,kw],i)=>{const c=kwCard(th,kw,"kc"+i);h+=c.html;draws.push(c.draw)});
  $("#main").innerHTML=h;draws.forEach(d=>d());bindCommon()}
function renderTheme(){const th=DATA.themes[st.tab];
  /* 테마: 7일 평균 선을 키워드별로 겹쳐 그림(실제 글 수라 수준 비교 가능) */
  const n=DATA.days.length,per=st.per,x=DATA.days.slice(n-per);
  let h=`<section class="card"><h2>${esc(th.name)}</h2><div class="muted">${esc(th.company)}</div>${ctrl()}
  <div class="seg" role="group" aria-label="기간" style="margin-top:6px">${[["2주",14],["30일",30],["60일",60]].map(([l,p])=>`<button type="button" data-per="${p}" aria-pressed="${st.per===p}">${l}</button>`).join("")}</div>
  <div class="scroll" id="tc"></div><div class="caption">7일 평균 새 글 수. 검색어 트렌드와 달리 실제 글 수라 키워드끼리 규모 비교가 됩니다.</div></section>`;
  const draws=[];th.kws.forEach((kw,i)=>{const c=kwCard(th,kw,"kc"+i);h+=c.html;draws.push(c.draw)});
  $("#main").innerHTML=h;
  lineChart($("#tc"),{x,unit:"date",partialFrom:null,title:th.short,src:`단위: 7일 평균 하루 새 글 수(${SRC[st.src]} · ${KIND[st.kind]})`,
    series:th.kws.map((kw,j)=>({name:kw.name,values:ma7(daily(kw)).slice(n-per),color:css(COLORS[j%5])}))});
  draws.forEach(d=>d());bindCommon()}
const norm=s=>String(s||"").toLowerCase().replace(/[\s()·\-_,.+]/g,"");
function search(q){const nq=norm(q);if(!nq)return[];const out=[];DATA.themes.forEach(th=>th.kws.forEach(kw=>{
  const strong=[kw.name,kw.term,kw.stock].map(norm),sc=strong.some(x=>x===nq)?3:strong.some(x=>x&&(x.includes(nq)||(nq.length>=3&&nq.includes(x))))?2:norm(th.short).includes(nq)?2:0;
  if(sc)out.push([th,kw,sc])}));return out.sort((a,b)=>b[2]-a[2]).map(x=>[x[0],x[1]])}

/* ---------- 렌더 ---------- */
function render(){document.querySelectorAll(".tb[data-tab]").forEach(b=>b.setAttribute("aria-selected",+b.dataset.tab===st.tab));$("#themeSel").value=st.tab>=0?String(st.tab):"";
  if(st.tab===-2){const r=search(st.q);renderList(`‘${esc(st.q)}’ 검색 결과 ${r.length}개`,r.slice(0,24),r.length?"":'<div class="note">추적 중인 목록에 없습니다. 새 키워드는 Claude에게 “○○ 추가”라고 말하면 다음 갱신부터 들어갑니다.</div>');return}
  if(st.tab>=0){renderTheme();return}
  const R=rows();$("#main").innerHTML=statusCard()+signalBoard(R)+volumeBoard(R)+tableCard(R);bindCommon();
  document.querySelectorAll("#bt th[data-s]").forEach(t=>t.onclick=()=>{const k=t.dataset.s;st.sortD=st.sortK===k?-st.sortD:(["theme","name","stock"].includes(k)?1:-1);st.sortK=k;render()})}
function bindCommon(){
  document.querySelectorAll("[data-src]").forEach(b=>b.onclick=()=>{st.src=b.dataset.src;render()});
  document.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{st.kind=b.dataset.kind;render()});
  document.querySelectorAll("[data-sep]").forEach(b=>b.onclick=()=>{st.sep=b.dataset.sep==="1";render()});
  document.querySelectorAll("[data-per]").forEach(b=>b.onclick=()=>{st.per=+b.dataset.per;render()});
  const g=$("#grp");if(g)g.onchange=e=>{st.grp=e.target.value;render()};
  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{setQuery(b.dataset.q);scrollTo(0,0)})}
function setQuery(q){st.q=q;$("#q").value=q;st.tab=q.trim()?-2:-1;render()}
function isDark(){const a=document.documentElement.getAttribute("data-theme");if(a==="dark")return true;if(a==="light")return false;return matchMedia("(prefers-color-scheme: dark)").matches}
function syncBtn(){$("#themeBtn").textContent=isDark()?"라이트 모드":"다크 모드"}
function init(){if(!DATA){$("#main").innerHTML='<div class="card note">데이터가 없습니다.</div>';return}
  $("#asof").textContent=`기준 ${DATA.generated_at.replace("T"," ")} KST · 출처 네이버 블로그·카페 검색(NAVER API HUB)`;
  $("#themeSel").innerHTML=`<option value="">테마 바로가기 (${DATA.themes.length}개)</option>`+groups().map(g=>`<optgroup label="${esc(g)}">${DATA.themes.map((t,i)=>t.group===g?`<option value="${i}">${esc(t.short)}</option>`:"").join("")}</optgroup>`).join("");
  $("#themeSel").onchange=e=>{if(e.target.value!==""){st.tab=+e.target.value;render();scrollTo(0,0)}};
  document.querySelectorAll(".tb[data-tab]").forEach(b=>b.onclick=()=>{st.tab=+b.dataset.tab;$("#q").value="";render();scrollTo(0,0)});
  const opts=new Set();DATA.themes.forEach(t=>t.kws.forEach(k=>{opts.add(k.name);if(k.stock)opts.add(k.stock)}));
  $("#qlist").innerHTML=[...opts].sort((a,b)=>a.localeCompare(b,"ko")).map(o=>`<option value="${esc(o)}"></option>`).join("");
  let qt;$("#q").addEventListener("input",e=>{clearTimeout(qt);qt=setTimeout(()=>setQuery(e.target.value),250)});
  $("#themeBtn").onclick=()=>document.documentElement.setAttribute("data-theme",isDark()?"light":"dark");
  new MutationObserver(()=>{syncBtn();render()}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{syncBtn();render()});
  let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(render,150)});
  $("#foot").innerHTML=`<p>· 이 대시보드는 블로그·카페 검색 API만 씁니다(검색어 트렌드 미사용). 숫자는 공개 검색에 잡힌 새 글 수이며 전체 게시글 수와 다를 수 있습니다.</p><p>· 글 수 증가가 매출·주가 상승을 입증하지는 않습니다. 투자 판단의 보조 신호로만 쓰세요.</p>`;
  syncBtn();render()}
init();

</script>
